<head>

  <title>04 — Moonlit Grove</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #040c18;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      font-weight: 200;
    }

    /* ── Stage ── */
    .stage {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .stage-bg {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 25% 60% at 50% 50%, rgba(200,220,255,0.14), transparent);
    }

    .stage-floor {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 35%;
      background: linear-gradient(to bottom, #0a1428, #040c18);
    }

    /* ── Stars ── */
    .star {
      position: absolute;
      border-radius: 50%;
      background: #ffffff;
      animation: twinkle var(--dur, 3s) ease-in-out infinite var(--delay, 0s);
    }
    @keyframes twinkle {
      0%,100% { opacity: 0.15; transform: scale(0.8); }
      50%      { opacity: 0.9;  transform: scale(1.15); }
    }

    /* ── Apple ── */
    .apple-wrap {
      position: relative;
      z-index: 5;
      opacity: 0;
      transform: scale(0.82);
      transition: opacity 1.4s ease 0.1s, transform 1.4s cubic-bezier(0.34,1.1,0.64,1) 0.1s;
    }
    .apple-wrap.show {
      opacity: 1;
      transform: scale(1);
    }

    /* ── Stage title ── */
    .stage-title {
      position: absolute;
      bottom: 9%;
      left: 50%;
      transform: translateX(-50%);
      z-index: 5;
      font-size: 13px;
      font-weight: 200;
      letter-spacing: 0.38em;
      text-transform: uppercase;
      color: #b8d4f0;
      opacity: 0;
      transition: opacity 1.5s ease 0.2s;
      white-space: nowrap;
    }
    .stage-title.show { opacity: 0.65; }

    /* ── Back link ── */
    .back-link {
      position: fixed;
      top: 26px;
      left: 32px;
      z-index: 200;
      font-weight: 200;
      font-size: 12px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(184,212,240,0.4);
      text-decoration: none;
      transition: color 0.3s;
    }
    .back-link:hover { color: #b8d4f0; }
    .back-link::before { content: '← '; }

    /* ── Vine curtains ── */
    .vines {
      position: fixed;
      inset: 0;
      z-index: 100;
      pointer-events: none;
    }

    .curtain {
      position: fixed;
      top: 0;
      height: 100vh;
      width: 55vw;
      will-change: transform;
      transition: transform 3.2s cubic-bezier(0.25,0.46,0.45,0.94);
    }
    .curtain-left  { left: 0; }
    .curtain-right { right: 0; }

    .vines.open .curtain-left  { transform: translateX(-100%); }
    .vines.open .curtain-right { transform: translateX(100%); }

    /* Neon glow on vine SVGs */
    .curtain svg {
      filter: drop-shadow(0 0 8px rgba(80,220,120,0.4));
    }
  </style>

  <script>
    // Scatter 40 stars across the stage
    (function() {
      const stage = document.getElementById('stage');
      for (let i = 0; i < 40; i++) {
        const s = document.createElement('div');
        s.className = 'star';
        const size = Math.random() < 0.5 ? 1 : 2;
        s.style.cssText = [
          'width:' + size + 'px',
          'height:' + size + 'px',
          'top:' + (Math.random() * 75) + '%',
          'left:' + (Math.random() * 100) + '%',
          '--dur:' + (2 + Math.random() * 3).toFixed(1) + 's',
          '--delay:-' + (Math.random() * 4).toFixed(1) + 's'
        ].join(';');
        stage.appendChild(s);
      }
    })();

    window.addEventListener('load', () => {
      setTimeout(() => {
        document.querySelector('.vines').classList.add('open');
        setTimeout(() => {
          document.querySelector('.apple-wrap').classList.add('show');
          document.querySelector('.stage-title').classList.add('show');
        }, 600);
      }, 900);
    });
