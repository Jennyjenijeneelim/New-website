<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <title>05 — Electric Jungle</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #050505;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      font-family: 'Courier New', Courier, 'Lucida Console', monospace;
      font-weight: 700;
    }

    /* ── Stage ── */
    .stage {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .stage-bg {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 50% 55% at 50% 60%, rgba(0,255,80,0.08), transparent);
    }

    .stage-floor {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 35%;
      background: linear-gradient(to bottom, #080f08, #030803);
    }

    /* ── Apple ── */
    .apple-wrap {
      position: relative;
      z-index: 5;
      opacity: 0;
      transform: scale(0.82);
      transition: opacity 0.6s ease 0.05s, transform 0.6s cubic-bezier(0.34,1.56,0.64,1) 0.05s;
    }
    .apple-wrap.show {
      opacity: 1;
      transform: scale(1);
    }

    /* ── Stage title ── */
    .stage-title {
      position: absolute;
      bottom: 9%;
      left: 50%;
      transform: translateX(-50%);
      z-index: 5;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.38em;
      text-transform: uppercase;
      color: #00ff60;
      opacity: 0;
      transition: opacity 0.8s ease 0.1s;
      white-space: nowrap;
      text-shadow: 0 0 12px rgba(0,255,96,0.7);
    }
    .stage-title.show { opacity: 0.85; }

    /* ── Back link ── */
    .back-link {
      position: fixed;
      top: 26px;
      left: 32px;
      z-index: 200;
      font-family: 'Courier New', monospace;
      font-weight: 700;
      font-size: 11px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(0,255,96,0.35);
      text-decoration: none;
      transition: color 0.2s, text-shadow 0.2s;
    }
    .back-link:hover {
      color: #00ff60;
      text-shadow: 0 0 10px rgba(0,255,96,0.6);
    }
    .back-link::before { content: '← '; }

    /* ── Vine curtains ── */
    .vines {
      position: fixed;
      inset: 0;
      z-index: 100;
      pointer-events: none;
    }

    .curtain {
      position: fixed;
      top: 0;
      height: 100vh;
      width: 55vw;
      will-change: transform;
      transition: transform 0.75s cubic-bezier(0.34,1.56,0.64,1);
    }
    .curtain-left  { left: 0; }
    .curtain-right { right: 0; }

    .vines.open .curtain-left  { transform: translateX(-100%); }
    .vines.open .curtain-right { transform: translateX(100%); }

    /* Neon glow on vine SVGs */
    .curtain svg {
      filter: drop-shadow(0 0 12px rgba(0,255,80,0.6));
    }
  </style>
